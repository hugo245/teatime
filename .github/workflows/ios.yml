name: iOS build

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'app/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: '1'
      TEATIME_SERVER_URL: ${{ vars.TEATIME_SERVER_URL }}
      TEATIME_BUNDLE_ID: ${{ vars.TEATIME_BUNDLE_ID || 'com.hugo245.teatime' }}
      TEATIME_BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install pods
        working-directory: app/ios
        run: pod install

      - name: Build archive
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/TeaTime.xcworkspace \
            -scheme TeaTime \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TeaTime.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*CallAudio|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/TeaTime.xcarchive/Products/Applications/TeaTime.app"

      - name: Show build errors
        if: failure()
        run: grep -n -B2 -A8 "error:" "$RUNNER_TEMP/xcodebuild.log" | tail -200 || true

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/TeaTime.xcarchive/Products/Applications/TeaTime.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry TeaTime.ipa Payload
          ls -lh TeaTime.ipa

      - name: Write version info
        run: |
          npx expo config --type public --json > "$RUNNER_TEMP/config.json"
          node -e '
            const config = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const info = {
              build: Number(process.env.TEATIME_BUILD_NUMBER),
              runtimeVersion: config.runtimeVersion,
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/ios-latest/TeaTime.ipa`,
            };
            require("fs").writeFileSync(process.argv[2], JSON.stringify(info));
          ' "$RUNNER_TEMP/config.json" "$RUNNER_TEMP/ipa/version.json"
          cat "$RUNNER_TEMP/ipa/version.json"

      - uses: actions/upload-artifact@v4
        with:
          name: TeaTime-ipa
          path: ${{ runner.temp }}/ipa/TeaTime.ipa
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest "$RUNNER_TEMP/ipa/TeaTime.ipa" "$RUNNER_TEMP/ipa/version.json" \
            --target "$GITHUB_SHA" \
            --title "TeaTime for iPhone (build $TEATIME_BUILD_NUMBER)" \
            --notes "Unsigned build from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Install it with Sideloadly or AltStore, see the README for the steps."
