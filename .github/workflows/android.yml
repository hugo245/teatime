name: Android build

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: '1'
      TEATIME_SERVER_URL: ${{ vars.TEATIME_SERVER_URL }}
      TEATIME_BUNDLE_ID: ${{ vars.TEATIME_BUNDLE_ID || 'com.hugo245.teatime' }}
      TEATIME_BUILD_NUMBER: ${{ github.run_number }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Package APK
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/TeaTime.apk"
          ls -lh "$RUNNER_TEMP/apk/TeaTime.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TeaTime-apk
          path: ${{ runner.temp }}/apk/TeaTime.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest "$RUNNER_TEMP/apk/TeaTime.apk" \
            --target "$GITHUB_SHA" \
            --title "TeaTime for Android (build $TEATIME_BUILD_NUMBER)" \
            --notes "Android build from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Download TeaTime.apk on the phone, open it and allow installing from this source."
