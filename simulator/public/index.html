<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeaTime Simulator</title>
  <link rel="icon" href="/simulator/favicon.png">
  <style>
    :root {
      --bg: #ECE7E0;
      --panel: #FFFFFF;
      --text: #1D2621;
      --muted: #5B655F;
      --primary: #2E6B4E;
      --border: #DDD5CA;
      --frame: #1B1D1C;
      --screen-w: 393px;
      --screen-h: 852px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(1200px 700px at 50% 0%, #F7F3EE 0%, var(--bg) 70%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    header {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
    .brand img { width: 34px; height: 34px; border-radius: 9px; }
    .brand span { color: var(--muted); font-weight: 600; }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .segmented {
      display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 3px;
    }
    .segmented button, .btn {
      font: inherit; font-size: 14px; font-weight: 650; border: 0; background: transparent; color: var(--muted);
      padding: 8px 14px; border-radius: 999px; cursor: pointer;
    }
    .segmented button[aria-pressed="true"] { background: var(--primary); color: #fff; }
    .btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
    .btn:hover { background: #F6F2EC; }
    .label { font-size: 13px; color: var(--muted); font-weight: 600; margin-right: 2px; }
    main {
      height: calc(100% - 68px - 40px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage { display: flex; gap: 72px; transform-origin: center center; }
    .device { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .device-name { font-size: 15px; font-weight: 700; color: var(--muted); display: flex; gap: 10px; align-items: center; }
    .device-name a { color: var(--primary); font-weight: 600; text-decoration: none; font-size: 13px; }
    .frame {
      position: relative;
      padding: 14px;
      border-radius: 68px;
      background: var(--frame);
      box-shadow: 0 0 0 2px #3A3D3B inset, 0 30px 60px rgba(40, 32, 20, 0.25), 0 8px 18px rgba(40, 32, 20, 0.18);
    }
    .frame::before, .frame::after {
      content: ""; position: absolute; width: 4px; background: #2A2C2B; border-radius: 2px;
    }
    .frame::before { left: -4px; top: 180px; height: 64px; box-shadow: 0 84px 0 #2A2C2B; }
    .frame::after { right: -4px; top: 230px; height: 96px; }
    .screen {
      position: relative;
      width: var(--screen-w);
      height: var(--screen-h);
      border-radius: 54px;
      overflow: hidden;
      background: #F7F3EE;
    }
    .screen iframe {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #F7F3EE;
    }
    .statusbar {
      position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 2; pointer-events: none;
      display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 46px;
      color: #111; font-weight: 650; font-size: 17px; letter-spacing: -0.01em;
      transition: color 0.2s ease;
    }
    .statusbar.light { color: #fff; }
    .statusbar .icons { display: flex; align-items: center; gap: 6px; }
    .statusbar svg { display: block; fill: currentColor; }
    .island {
      position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
      width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 3; pointer-events: none;
    }
    .home {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 136px; height: 5px; border-radius: 3px; background: #111; z-index: 3; pointer-events: none; opacity: 0.85;
      transition: background 0.2s ease;
    }
    .home.light { background: #fff; }
    footer {
      height: 40px; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 13px; gap: 6px; text-align: center; padding: 0 16px;
    }
    footer code { background: rgba(255,255,255,0.7); padding: 2px 6px; border-radius: 6px; }
    @media (max-width: 900px) {
      header { height: auto; padding: 12px 16px; flex-direction: column; align-items: flex-start; }
      body { overflow: auto; }
      main { height: auto; padding: 24px 0; }
      #stage { flex-direction: column; gap: 40px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/simulator/favicon.png" alt="">
      TeaTime <span>Simulator</span>
    </div>
    <div class="controls">
      <span class="label">Camera</span>
      <div class="segmented" role="group" aria-label="Camera">
        <button type="button" data-camera="real">Webcam</button>
        <button type="button" data-camera="demo">Demo video</button>
      </div>
      <span class="label">Call sound</span>
      <div class="segmented" role="group" aria-label="Call sound">
        <button type="button" data-sound="off">Off</button>
        <button type="button" data-sound="on">On</button>
      </div>
      <button class="btn" type="button" id="reload">Restart phones</button>
      <button class="btn" type="button" id="reset">Reset phones</button>
    </div>
  </header>

  <main>
    <div id="stage"></div>
  </main>

  <footer id="hint">Each phone is its own TeaTime user. Tap Meet someone new on both phones to connect them.</footer>

  <template id="device-template">
    <div class="device">
      <div class="device-name"><span class="title"></span><a target="_blank" rel="noopener">Open alone</a></div>
      <div class="frame">
        <div class="screen">
          <div class="statusbar">
            <span class="time">9:41</span>
            <span class="icons">
              <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.2C13.2 1.6 10.7.6 8 .6S2.8 1.6.9 3.4L2 4.6c1.6-1.5 3.7-2.4 6-2.4zm0 3.3c1.4 0 2.6.5 3.6 1.4l1.1-1.2C11.4 4.5 9.8 3.9 8 3.9s-3.4.6-4.7 1.8l1.1 1.2c1-.9 2.2-1.4 3.6-1.4zm0 3.3c-.6 0-1.2.2-1.6.6L8 11.2l1.6-1.8c-.4-.4-1-.6-1.6-.6z"/></svg>
              <svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-opacity="0.4"/><rect x="2" y="2" width="18" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill-opacity="0.4"/></svg>
            </span>
          </div>
          <div class="island"></div>
          <iframe allow="camera; microphone; autoplay; clipboard-write" title="TeaTime phone"></iframe>
          <div class="home"></div>
        </div>
      </div>
    </div>
  </template>

  <script>
    (function () {
      var DEVICES = ['a', 'b'];
      var params = new URLSearchParams(location.search);
      var count = Math.max(1, Math.min(4, Number(params.get('phones')) || 2));
      DEVICES = 'abcd'.slice(0, count).split('');

      var store = {
        get: function () {
          try { return JSON.parse(localStorage.getItem('teatime-simulator') || '{}'); } catch (e) { return {}; }
        },
        set: function (value) {
          try { localStorage.setItem('teatime-simulator', JSON.stringify(value)); } catch (e) {}
        }
      };
      var settings = Object.assign({ camera: 'real', sound: 'off' }, store.get());

      var stage = document.getElementById('stage');
      var template = document.getElementById('device-template');
      var frames = {};

      function appUrl(device) {
        var q = new URLSearchParams({ sim: '1', device: device, camera: settings.camera, sound: settings.sound === 'on' ? '1' : '0' });
        return '/?' + q.toString();
      }

      DEVICES.forEach(function (device) {
        var node = template.content.firstElementChild.cloneNode(true);
        node.querySelector('.title').textContent = 'iPhone ' + device.toUpperCase();
        var link = node.querySelector('a');
        link.href = appUrl(device);
        var iframe = node.querySelector('iframe');
        iframe.src = appUrl(device);
        iframe.title = 'TeaTime on iPhone ' + device.toUpperCase();
        stage.appendChild(node);
        frames[device] = {
          iframe: iframe,
          link: link,
          statusbar: node.querySelector('.statusbar'),
          home: node.querySelector('.home')
        };
      });

      function render() {
        document.querySelectorAll('[data-camera]').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.camera === settings.camera));
        });
        document.querySelectorAll('[data-sound]').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.sound === settings.sound));
        });
      }

      function reloadAll() {
        DEVICES.forEach(function (d) {
          frames[d].iframe.src = appUrl(d);
          frames[d].link.href = appUrl(d);
          setStatusStyle(d, 'dark');
        });
      }

      function setStatusStyle(device, style) {
        var f = frames[device];
        if (!f) return;
        f.statusbar.classList.toggle('light', style === 'light');
        f.home.classList.toggle('light', style === 'light');
      }

      document.querySelectorAll('[data-camera]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (settings.camera === b.dataset.camera) return;
          settings.camera = b.dataset.camera;
          store.set(settings);
          render();
          reloadAll();
        });
      });

      document.querySelectorAll('[data-sound]').forEach(function (b) {
        b.addEventListener('click', function () {
          settings.sound = b.dataset.sound;
          store.set(settings);
          render();
          DEVICES.forEach(function (d) {
            frames[d].link.href = appUrl(d);
            try { frames[d].iframe.contentWindow.postMessage({ type: 'teatime:sound', on: settings.sound === 'on' }, '*'); } catch (e) {}
          });
        });
      });

      document.getElementById('reload').addEventListener('click', reloadAll);

      document.getElementById('reset').addEventListener('click', function () {
        if (!confirm('Reset both phones? They will start again from the welcome screen as new people.')) return;
        var remove = [];
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (DEVICES.some(function (d) { return key.indexOf('teatime:' + d + ':') === 0; })) remove.push(key);
        }
        remove.forEach(function (k) { localStorage.removeItem(k); });
        reloadAll();
      });

      window.addEventListener('message', function (event) {
        var data = event.data || {};
        if (data.type === 'teatime:statusbar') setStatusStyle(data.device, data.style);
      });

      function tick() {
        var now = new Date();
        var text = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
        document.querySelectorAll('.statusbar .time').forEach(function (el) { el.textContent = text; });
      }
      tick();
      setInterval(tick, 10000);

      function fit() {
        if (window.innerWidth <= 900) { stage.style.transform = ''; return; }
        var available = window.innerHeight - 68 - 40 - 24;
        var widthNeeded = DEVICES.length * (393 + 28) + (DEVICES.length - 1) * 72 + 48;
        var scale = Math.min(1, available / (852 + 28 + 34), window.innerWidth / widthNeeded);
        stage.style.transform = 'scale(' + scale.toFixed(3) + ')';
      }
      window.addEventListener('resize', fit);
      fit();
      render();
    })();
  </script>
</body>
</html>
