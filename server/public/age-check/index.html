<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>TeaTime age check</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #F7F3EE; color: #1D2621; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 12px; }
    .ring { position: relative; --s: min(72vw, 52vh, 300px); width: var(--s); height: var(--s); flex: none; border-radius: 50%; padding: 8px; background: #E6DFD4; }
    .circle { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #26302B; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
    #status { font-size: 22px; font-weight: 700; text-align: center; min-height: 58px; max-width: 340px; line-height: 1.3; }
    .arrow { font-size: 40px; height: 44px; line-height: 44px; color: #2E6B4E; text-align: center; }
    .frames main { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="ring" id="ring">
      <div class="circle"><video id="video" playsinline autoplay muted></video></div>
    </div>
    <div class="arrow" id="arrow"></div>
    <div id="status">Getting ready</div>
  </main>
  <script src="face-api.js"></script>
  <script>
    (function () {
      var SAMPLES = 8;
      var TIMEOUT = 60000;
      var NO_FACE_TIMEOUT = 40000;
      var framesMode = /[?&]mode=frames/.test(location.search);
      if (framesMode) document.documentElement.className = 'frames';
      var video = document.getElementById('video');
      var statusEl = document.getElementById('status');
      var arrowEl = document.getElementById('arrow');
      var ring = document.getElementById('ring');
      var stream = null;
      var finished = false;
      var options = null;
      var progress = 0;
      var state = { ages: [], phase: 'straight', firstSide: null, opened: Date.now(), started: 0, lastSeen: Date.now() };

      function send(message) {
        var text = JSON.stringify(message);
        if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(text);
        else if (window.parent !== window) window.parent.postMessage({ teatimeAgeCheck: message }, '*');
      }

      function setStatus(text, turn) {
        statusEl.textContent = text;
        arrowEl.textContent = turn ? '↔' : '';
        send({ type: 'status', text: text, turn: !!turn, progress: progress });
      }

      function setProgress(fraction) {
        progress = Math.min(1, fraction);
        ring.style.background = 'conic-gradient(#2E6B4E ' + Math.round(progress * 100) + '%, #E6DFD4 0)';
      }

      function median(values) {
        var sorted = values.slice().sort(function (a, b) { return a - b; });
        var mid = Math.floor(sorted.length / 2);
        return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
      }

      function end(message) {
        if (finished) return;
        finished = true;
        if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
        send(message);
      }

      function turnRatio(landmarks) {
        var p = landmarks.positions;
        var width = p[45].x - p[36].x;
        if (!width) return 0.5;
        return (p[30].x - p[36].x) / width;
      }

      function timedOut() {
        var now = Date.now();
        if ((state.started && now - state.started > TIMEOUT) || (!state.started && now - state.opened > NO_FACE_TIMEOUT)) {
          setStatus('That took too long. Please try again in good light.');
          end({ type: 'timeout' });
          return true;
        }
        return false;
      }

      function analyze(input) {
        if (finished || timedOut()) return Promise.resolve();
        return faceapi.detectSingleFace(input, options).withFaceLandmarks(true).withAgeAndGender().then(function (result) {
          if (finished) return;
          if (!result || result.detection.score < 0.6) {
            if (Date.now() - state.lastSeen > 4000) setStatus('We cannot see your face. Hold the phone in front of you, in good light.');
            return;
          }
          state.lastSeen = Date.now();
          if (!state.started) state.started = Date.now();
          var ratio = turnRatio(result.landmarks);
          if (state.phase === 'straight') {
            if (ratio > 0.35 && ratio < 0.65) {
              state.ages.push(result.age);
              setProgress((state.ages.length / SAMPLES) * 0.6);
              if (state.ages.length >= SAMPLES) {
                state.phase = 'turn1';
                setStatus('Now slowly turn your head to one side', true);
              } else {
                setStatus('Keep looking at the camera');
              }
            } else {
              setStatus('Look straight at the camera');
            }
          } else if (state.phase === 'turn1') {
            if (ratio < 0.27 || ratio > 0.73) {
              state.firstSide = ratio < 0.5 ? 'low' : 'high';
              state.phase = 'turn2';
              setProgress(0.8);
              setStatus('Good. Now turn to the other side', true);
            }
          } else if ((state.firstSide === 'low' && ratio > 0.73) || (state.firstSide === 'high' && ratio < 0.27)) {
            setProgress(1);
            setStatus('All done, thank you');
            end({ type: 'result', age: median(state.ages), samples: state.ages.length, live: true });
          }
        });
      }

      function cameraLoop() {
        if (finished) return;
        analyze(video).catch(function () { return null; }).then(function () {
          if (!finished) setTimeout(cameraLoop, 120);
        });
      }

      function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.reject(new Error('getUserMedia unavailable'));
        return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 640 } }, audio: false }).then(function (s) {
          stream = s;
          video.srcObject = s;
          return video.play().catch(function () {});
        }).then(function () {
          return new Promise(function (resolve) {
            if (video.readyState >= 2) return resolve();
            video.onloadeddata = function () { resolve(); };
          });
        });
      }

      window.__teatimeFrame = function (dataUrl) {
        var img = new Image();
        img.onload = function () {
          analyze(img).catch(function (error) {
            send({ type: 'debug', detail: String((error && error.message) || error) });
          }).then(function () {
            send({ type: 'frameDone' });
          });
        };
        img.onerror = function () { send({ type: 'frameDone' }); };
        img.src = dataUrl;
      };

      Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri('models'),
        faceapi.nets.faceLandmark68TinyNet.loadFromUri('models'),
        faceapi.nets.ageGenderNet.loadFromUri('models')
      ]).then(function () {
        options = new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 });
        if (framesMode) {
          state.opened = Date.now();
          send({ type: 'ready' });
          setStatus('Look straight at the camera');
          return;
        }
        setStatus('Turning on your camera');
        return startCamera().then(function () {
          state.opened = Date.now();
          send({ type: 'ready' });
          setStatus('Look straight at the camera');
          cameraLoop();
        }, function (error) {
          setStatus('TeaTime could not use your camera.');
          end({ type: 'nocamera', detail: String((error && (error.name || error.message)) || error) });
        });
      }).catch(function (error) {
        setStatus('Something went wrong. Please try again.');
        end({ type: 'error', detail: 'models: ' + String((error && error.message) || error) });
      });
    })();
  </script>
</body>
</html>
